<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق السعرات والستريك</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">
    <div class="max-w-md mx-auto px-4 pt-6 space-y-5">
        <header class="text-center space-y-1">
            <h1 class="text-2xl font-extrabold tracking-tight text-emerald-400">حاسبة السعرات والستريك</h1>
            <p class="text-xs text-slate-400">تابع سعراتك واصنع سجلك اليومي بنجاح</p>
        </header>

        <!-- Streak Card -->
        <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4 flex items-center justify-between shadow-lg">
            <div>
                <span class="text-xs text-slate-400 block">التزام متواصل</span>
                <span id="streak-count" class="text-2xl font-black text-amber-400">0 أيام</span>
            </div>
            <div class="bg-amber-400/10 p-3 rounded-xl text-amber-400 text-xl">🔥</div>
        </div>

        <!-- Daily Target & Progress -->
        <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4 space-y-3 shadow-lg">
            <div class="flex justify-between items-center text-sm">
                <span class="text-slate-300 font-medium">السعرات اليومية</span>
                <span id="calories-text" class="font-bold text-emerald-400">0 / 2000 سعرة</span>
            </div>
            <div class="w-full bg-slate-700 h-3 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-emerald-500 h-full w-0 transition-all duration-300"></div>
            </div>
        </div>

        <!-- Add Food Form -->
        <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4 space-y-3 shadow-lg">
            <h2 class="text-sm font-bold text-slate-200">إضافة وجبة جديدة</h2>
            <div class="space-y-2">
                <input type="text" id="food-name" placeholder="اسم الوجبة (مثال: وجبة غداء)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                <input type="number" id="food-calories" placeholder="السعرات الحرارية" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                <button onclick="addFood()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2.5 rounded-xl transition-all shadow-md text-sm">إضافة للوجبات</button>
            </div>
        </div>

        <!-- Food List -->
        <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4 space-y-3 shadow-lg">
            <h2 class="text-sm font-bold text-slate-200">وجبات اليوم</h2>
            <div id="food-list" class="space-y-2 max-h-48 overflow-y-auto">
                <p class="text-xs text-slate-500 text-center py-4">لا توجد وجبات مسجلة اليوم</p>
            </div>
        </div>
    </div>

    <script>
        let calories = 0;
        let maxCalories = 2000;
        let streak = 0;
        let foods = [];

        function loadData() {
            const savedData = localStorage.getItem('calorieData');
            if (savedData) {
                const data = JSON.parse(savedData);
                calories = data.calories || 0;
                streak = data.streak || 0;
                foods = data.foods || [];
                updateUI();
            }
        }

        function saveData() {
            localStorage.setItem('calorieData', JSON.stringify({ calories, streak, foods }));
        }

        function addFood() {
            const nameInput = document.getElementById('food-name');
            const calInput = document.getElementById('food-calories');
            
            const name = nameInput.value.trim();
            const cal = parseInt(calInput.value);

            if (!name || isNaN(cal) || cal <= 0) return;

            foods.push({ name, calories: cal });
            calories += cal;
            if (streak === 0) streak = 1;

            nameInput.value = '';
            calInput.value = '';

            saveData();
            updateUI();
        }

        function updateUI() {
            document.getElementById('calories-text').innerText = `${calories} / ${maxCalories} سعرة`;
            document.getElementById('streak-count').innerText = `${streak} أيام`;
            
            let percent = Math.min((calories / maxCalories) * 100, 100);
            document.getElementById('progress-bar').style.width = `${percent}%`;

            const listContainer = document.getElementById('food-list');
            if (foods.length === 0) {
                listContainer.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">لا توجد وجبات مسجلة اليوم</p>';
                return;
            }

            listContainer.innerHTML = foods.map((f, index) => `
                <div class="flex justify-between items-center bg-slate-900/60 p-2.5 rounded-xl border border-slate-700/40 text-sm">
                    <span class="font-medium text-slate-200">${f.name}</span>
                    <div class="flex items-center space-x-3 space-x-reverse">
                        <span class="text-emerald-400 font-bold">${f.calories} سعرة</span>
                        <button onclick="deleteFood(${index})" class="text-rose-400 hover:text-rose-300 text-xs font-bold">حذف</button>
                    </div>
                </div>
            `).join('');
        }

        function deleteFood(index) {
            calories -= foods[index].calories;
            foods.splice(index, 1);
            saveData();
            updateUI();
        }

        loadData();
    </script>
</body>
</html>
